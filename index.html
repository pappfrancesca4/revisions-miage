{ id:'c1', title:'Relations presse', sub:'Communiqué de presse, dossier de presse, rencontres presse', html:`
<p class="lead">Les <b>relations presse (RP)</b> servent à faire parler de l'entreprise dans les médias <b>sans acheter d'espace publicitaire</b>. Les outils : le communiqué de presse, le dossier de presse et les rencontres avec les journalistes.</p>

<h3>1. Le communiqué de presse (CP)</h3>
<p>Document court envoyé aux journalistes pour annoncer <b>une</b> information.</p>
<div class="def"><b>Sur la 1ʳᵉ page (4 éléments)</b> : la mention « COMMUNIQUÉ DE PRESSE », le <b>logo</b>, la <b>date du jour</b>, le <b>titre</b> du communiqué.</div>
<div class="def"><b>Le chapô</b> (le petit paragraphe d'introduction, en gras sous le titre) répond aux <b>5 W</b> : <b>Who</b> (qui), <b>What</b> (quoi), <b>Where</b> (où), <b>When</b> (quand), <b>Why</b> (pourquoi).<br><b>5 lignes maximum</b>, <b>250 à 350 signes</b>.</div>
<ul>
<li><b>« À propos »</b> (en bas) : présenter la structure émettrice + son site web.</li>
<li><b>Contacts presse</b> : nom, prénom, téléphone, e-mail.</li>
</ul>

<h3>2. Les conseils pour un bon CP</h3>
<ol>
<li>L'info principale est <b>visible et comprise dès le titre et le chapô</b>.</li>
<li>Rédiger à la <b>3ᵉ personne</b> et au <b>présent</b>, formulation <b>active</b>, image positive.</li>
<li><b>Pas de phrase inutile</b>.</li>
<li>Ne pas oublier le <b>logo</b> et les <b>contacts presse</b>.</li>
<li><b>Pas de jargon</b> ni d'acronymes sans explication.</li>
<li><b>Phrases courtes</b> : S-V-C (Sujet, Verbe, Complément).</li>
<li><b>Pas de phrases toutes faites</b>.</li>
<li><b>Mettre en scène les chiffres</b> : préférer les %, utiliser métaphores et comparaisons.</li>
<li><b>Digitaliser</b> le CP : schémas, photos, liens, vidéos (favorise le partage sur les réseaux).</li>
<li><b>Éviter les superlatifs</b> : révolutionnaire, incroyable, fabuleux…</li>
<li>Organiser selon les temps : <b>Quoi ?</b> faits, chiffres = <b>présent</b> ; <b>Pourquoi ?</b> causes, évolutions = <b>passé</b> ; <b>Vers quoi ?</b> perspectives, objectifs = <b>futur</b>.</li>
</ol>

<h3>3. Le dossier de presse</h3>
<p>Plus complet que le CP : il présente l'entreprise en détail.</p>
<div class="def"><b>Contenu</b> :<br>
• Page de garde professionnelle<br>
• Page 1 : le <b>mot du PDG</b> / fondateur / créateur<br>
• Page 2 : la <b>présentation de l'entreprise</b><br>
• Page 3 : la <b>revue de presse</b><br>
• Page 4 : les <b>chiffres</b><br>
• Page 5 : les <b>contacts</b> (adresse, numéro, e-mails…)</div>

<h3>4. Les 5 façons de rencontrer la presse</h3>
<div class="def"><b>La conférence de presse</b><br>
• Permet de toucher <b>plusieurs médias</b> à la fois<br>
• Rendre le rendez-vous <b>attractif</b><br>
• Protocole d'intervention orchestré : <b>1/ VIP, 2/ porte-parole de l'événement, 3/ autres intervenants</b><br>
• <b>Anticiper les questions sensibles</b><br>
• Durée : <b>15-20 min</b> d'intervention + <b>20 min</b> de questions des journalistes</div>
<div class="def"><b>Le déjeuner de presse</b> (ou petit-déjeuner)<br>
• Pas trop de monde, pour un échange calme<br>
• Économique et rapide<br>
• Moment de la journée le plus propice<br>
• Ambiance décontractée</div>
<div class="def"><b>Le voyage de presse</b><br>
• Développer des relations privilégiées dans un cadre différent du quotidien<br>
• Organisation logistique irréprochable<br>
• Règles déontologiques strictes</div>
<div class="def"><b>Le one-to-one</b><br>
• Souvent une première entrevue<br>
• Faire connaissance, nouer un contact plus personnel<br>
• Échanger sur l'actualité</div>
<div class="def"><b>Le portage</b><br>
• Faire parvenir un produit ou un échantillon aux journalistes choisis selon leurs affinités<br>
• Envoi accompagné d'un CP ou d'un dossier de presse</div>

<h3>5. Les RP et l'IA (4 enjeux)</h3>
<ul>
<li>Automatisation et gain de productivité</li>
<li>Risque d'<b>aseptisation</b> des discours (tous pareils)</li>
<li>Défi pour le recrutement et la formation</li>
<li>Outils d'IA et <b>souveraineté des données</b></li>
</ul>
`},

{ id:'c2', title:'Le plan de communication', sub:'COMM : cibles, objectifs, messages, médias, ROI', html:`
<div class="def"><b>Définition</b> : le plan de communication est un document plus ou moins détaillé reprenant <b>l'ensemble des actions de communication</b> prévues pour promouvoir une <b>entreprise, une marque, un produit ou un événement</b>. Il contient avant tout un <b>agenda</b>.</div>
<p><b>Principe</b> : un <b>émetteur</b> a un <b>message</b> à faire passer à un <b>récepteur</b>. Un plan de comm n'a pas forcément vocation à obtenir un retour.</p>

<h3>1. La stratégie : C.O.M.M.</h3>
<div class="key"><b>C</b>ibles – <b>O</b>bjectifs – <b>M</b>essages – <b>M</b>édias</div>

<h3>2. C comme Cibles</h3>
<p>Identifier la cible et ses besoins (« un bon commercial est quelqu'un qui écoute »). Ex. : catégories socio-professionnelles, tranches d'âge. Avant une campagne, on peut faire un sondage sur la population (âge, sexe, niveau d'études…).</p>
<p><b>4 outils</b> pour analyser la cible :</p>
<div class="tablewrap"><table class="laws">
<tr><th>4P</th><th>4C</th><th>SAVE</th><th>4E</th></tr>
<tr><td>Produit</td><td>Consommateur</td><td>Solution</td><td>Émotion</td></tr>
<tr><td>Place</td><td>Coût</td><td>Accès</td><td>Expérience</td></tr>
<tr><td>Prix</td><td>Commodité</td><td>Valeur</td><td>Exclusivité</td></tr>
<tr><td>Promotion</td><td>Communication</td><td>Éducation</td><td>Engagement</td></tr>
</table></div>
<p>Les colonnes se correspondent ligne par ligne : Produit → Consommateur → Solution → Émotion, etc.</p>

<h3>3. O comme Objectifs (3 effets)</h3>
<div class="tablewrap"><table class="laws">
<tr><th>Objectif</th><th>Effet</th><th>Résultat</th></tr>
<tr><td><b>Faire savoir</b></td><td>Cognitif</td><td><b>Notoriété</b> (= visibilité, être connu)</td></tr>
<tr><td><b>Faire aimer</b></td><td>Affectif</td><td><b>Image</b> (sentiment positif)</td></tr>
<tr><td><b>Faire agir</b></td><td>Conatif</td><td><b>Réputation</b> (acheter, s'inscrire, participer)</td></tr>
</table></div>
<div class="ex">« Vous connaissez ce restaurant ? » → « Oui » = <b>notoriété</b>. « Il est bon » = <b>image</b>. « Je l'adore » = <b>réputation</b>.</div>
<div class="trap">Rien à voir avec les objectifs SMART (qui servent au plan <b>média</b>).</div>

<h3>4. M comme Messages (4 éléments)</h3>
<ul>
<li><b>Promesse</b> : qu'est-ce qu'on promet au client ?</li>
<li><b>Bénéfice client</b> : qu'est-ce que le client y gagne ?</li>
<li><b>Arguments</b> : pourquoi devrait-il nous croire ?</li>
<li><b>Style et ton</b> : comment va-t-on lui parler (selon la cible) ?</li>
</ul>

<h3>5. M comme Médias</h3>
<p><b>4 grandes familles</b> : radio, journaux (presse), TV, Internet. (Dans les notes de TD : presse parlée, presse écrite, presse digitale, presse partagée.)</p>
<p>Le plan contient des actions <b>média</b> et <b>hors média</b>.</p>

<h3>6. Mise en œuvre, révision, analyse</h3>
<ul>
<li><b>Mise en œuvre</b> : planning, souvent sur l'année. Il est fait <b>l'année N-1 pour l'année N</b> (les budgets sont annualisés).</li>
<li><b>Révision</b> : <b>annuelle ou semestrielle</b>.</li>
<li>En cas de réduction des dépenses, le plan de comm est <b>le 1er sacrifié</b>.</li>
</ul>
<div class="formula">ROI = (gain − dépense) / dépense × 100</div>
<p><b>Limite du ROI</b> : on n'a jamais la certitude de ce qu'on gagne ; on ne peut pas prouver que les acheteurs ont vu la campagne.</p>
`},

{ id:'c3', title:'Le plan média', sub:'Règles, marché cible, objectifs, supports, contraintes', html:`
<div class="def"><b>Définition</b> : le plan média est la <b>liste des supports sélectionnés</b> et des <b>dates retenues</b> pour la diffusion des messages publicitaires. Objectif : obtenir la <b>meilleure couverture possible de la cible</b> définie dans la stratégie de communication.</div>
<div class="trap">Ne pas confondre : le <b>plan de comm</b> contient des actions média ET hors média. Le <b>plan média</b> ne concerne que les médias (achat d'espace).</div>

<h3>1. Les 5 règles de base</h3>
<ol>
<li><b>Pensez consommateur</b> : construire le plan selon ses attentes et besoins.</li>
<li><b>Restez flexible</b>.</li>
<li><b>Définissez des objectifs réalistes</b> (objectifs SMART).</li>
<li><b>Faites simple</b> (trop de comm tue la comm).</li>
<li><b>Gardez le plan à jour</b> (par trimestre ou semestre).</li>
</ol>

<h3>2. Le marché cible : les 4C</h3>
<div class="tablewrap"><table class="laws">
<tr><th>Cible</th><th>Type de comm</th></tr>
<tr><td><b>Consommateurs</b></td><td>comm commerciale / marketing</td></tr>
<tr><td><b>Collaborateurs</b></td><td>comm interne</td></tr>
<tr><td><b>Citoyens</b></td><td>comm institutionnelle</td></tr>
<tr><td><b>Capitaux</b></td><td>comm financière (actionnaires)</td></tr>
</table></div>
<div class="trap">Ces 4C (marché cible du plan média) ne sont pas les 4C du marketing (Consommateur, Coût, Commodité, Communication).</div>

<h3>3. Les 4 objectifs du plan média</h3>
<ul>
<li><b>Période spécifique</b> (quand diffuser)</li>
<li><b>Audience cumulée</b> (combien de personnes touchées, par quels canaux)</li>
<li><b>Répétition</b> (combien de fois le message doit passer)</li>
<li><b>Couverture géographique</b></li>
</ul>

<h3>4. Les étapes</h3>
<ul>
<li><b>Choix des supports</b> (achat d'espace) : radio, presse, panneaux publicitaires, pubs dans les transports (tram), TV, réseaux sociaux / digital.</li>
<li><b>Détermination des cadences</b> : répétitions sur différentes plages horaires.</li>
<li><b>Élaboration du plan</b> : planification de la comm média, hors média…</li>
</ul>

<h3>5. Les 4 contraintes</h3>
<ul>
<li><b>Financières</b></li>
<li><b>Juridiques / légales</b></li>
<li><b>D'emplacement</b> (« ah non, là c'est déjà pris »)</li>
<li><b>Délai de fabrication</b></li>
</ul>

<h3>6. Financements (exemple du cours)</h3>
<p>Aides à l'innovation : <b>BPI France 150 000 €</b>, <b>French Tech CA 10 000 €</b>, <b>Région Sud 5 000 €</b>.</p>
`},

{ id:'c4', title:'Networking or not working', sub:'Réseau, bande-annonce, règles, Q3C, appel réseau', html:`
<h3>1. Pourquoi le réseau ?</h3>
<ul>
<li><b>70 %</b> des offres d'emploi sont diffusées par les réseaux.</li>
<li><b>2 emplois cadres sur 3</b> sont obtenus par cooptation.</li>
<li><b>600 000</b> étudiants arrivent chaque année sur le marché de l'emploi.</li>
</ul>
<div class="def"><b>Les 5 finalités professionnelles du réseau</b> (chacune englobe la précédente) :<br>1. Être connu → 2. Être une référence → 3. S'informer → 4. Se former → 5. Partager</div>
<ul>
<li>Différence entre <b>Réseau</b> et <b>réseaux</b> (sociaux).</li>
<li>Devenir <b>visible et lisible</b>.</li>
<li>La <b>sérendipité</b> au cœur du réseau : trouver quelque chose qu'on ne cherchait pas.</li>
<li><b>Inégalité</b> devant le réseau.</li>
</ul>
<p><b>Façons de réseauter</b> : entre amis, en entreprise, dans les associations, dans la famille.</p>
<p><b>Étymologie de « réseau »</b> : ensemble de lignes entrelacées ; petit filet pour prendre des oiseaux et du menu gibier ; filet à mailles plus ou moins larges ; tissu en forme de mailles.</p>
<p><b>Les types de réseaux (5)</b> : communautés, tribus, groupes, clubs/clans, gangs/bandes.</p>

<h3>2. Votre 1er réseau</h3>
<ul>
<li><b>État des lieux (4)</b> : la famille, les amis, les relations étudiantes et pro, les contacts réseaux sociaux.</li>
<li><b>Fondations</b> : smartphone/téléphone, e-mail, carnet d'adresses, carte de visite, contacts des réseaux sociaux.</li>
</ul>
<div class="def"><b>Tri des contacts : 4 questions</b> avant d'en faire un contact de son réseau :<br>
1. Me sentirais-je autorisé à le contacter directement ?<br>
2. Est-il probable qu'il prête une oreille attentive à mes propos ?<br>
3. Est-il envisageable qu'il réponde favorablement à une requête raisonnable (information, conseil, relais vers quelqu'un, rendez-vous) ?<br>
4. (Subsidiaire) Et moi, répondrais-je à une telle sollicitation de sa part ?</div>
<p><b>Structure du fichier contacts</b> : civilité, nom, prénom, téléphone, e-mail, société, fonction, adresse, ville, code postal, connu via, dates de rdv, besoins, actions, commentaires.</p>

<h3>3. Les 5 premiers atouts pour réseauter</h3>
<ol>
<li>La <b>carte de visite</b></li>
<li>Un <b>agenda pro-réseau</b></li>
<li>Le <b>two + two + one</b> : ne jamais déjeuner seul, programmer à l'avance. Par semaine : <b>2</b> déjeuners avec des externes, <b>2</b> avec des collègues peu ou pas connus, <b>1</b> avec des amis ou collègues proches.</li>
<li>Les <b>cartes de vœux</b> papier ou digitales</li>
<li>Votre <b>bande-annonce</b> (pitch de présentation)</li>
</ol>
<div class="def"><b>Bande-annonce : 4 règles</b> : la <b>clarté</b>, la <b>concision</b>, l'<b>impact</b>, la <b>spécificité</b>.<br><br>
<b>Partie rationnelle</b> : prénom/nom/société (se présenter) ; accroche (intriguer) ; métier/activité (se situer) ; clients ; contexte (les enjeux) ; bénéfices (sa compétence) ; preuves (légitimer sa valeur ajoutée).<br>
<b>Partie émotionnelle</b> : histoire (son parcours) ; ce que j'aime (créer des affinités) ; rêve (motiver).</div>
<p><b>Les 2 fléaux à identifier</b> : combattre le <b>réseau kleenex</b> (on utilise puis on jette) et <b>éliminer les toxiques</b> (« management du jardinier »).</p>

<h3>4. Réseauter en interne</h3>
<ul>
<li>Son domaine professionnel ou étudiant ; en connaître la <b>culture interne</b> ; analyser le <b>rôle caché</b> des acteurs ; repérer ses cibles.</li>
<li><b>Comment</b> : communiquer sur l'annonce de son arrivée ; rencontrer et découvrir (informel et formel) ; écouter, jouer collectif ; créer des relations visuelles et physiques ; se former en interne.</li>
<li><b>RSE</b> ici = <b>Réseau Social d'Entreprise</b> (outil interne numérique).</li>
</ul>

<h3>5. Réseauter en externe</h3>
<p>Pourquoi c'est important aujourd'hui : fin des carrières mono-entreprise, montée des missions au lieu des CDI, <b>le réseau = assurance anti-chômage</b>.</p>
<ul>
<li>Entretenir sa visibilité ; la maximiser grâce au Net ; continuer à se former à l'extérieur ; soigner ses relations avec la presse ; réseauter à l'international.</li>
<li>Adhérer aux associations/réseaux existants ; rencontrer des professionnels ; forums, salons, conférences, anciens de… ; Internet (LinkedIn) ; les chasseurs de têtes.</li>
</ul>
<p>« Si c'est gratuit, c'est vous le produit » (Derek Powazek).</p>

<h3>6. Règles et usages</h3>
<div class="key"><b>La demande magique</b> : « En quoi puis-je vous aider ? »<br>« Si vous voulez vous faire un ami, laissez quelqu'un vous rendre un service. »</div>
<p><b>Les 4 qualités de l'esprit réseau</b> : partage, bienveillance, solidarité, entraide.</p>
<ol>
<li>La <b>confiance</b>, socle du réseautage</li>
<li>De <b>professionnel à professionnel</b></li>
<li><b>Gagnant-gagnant</b> ou donnant-donnant</li>
<li>La loi de la <b>réciprocité</b></li>
<li><b>Tenir ses engagements</b></li>
<li><b>Politesse</b> et « savoir-réseauter »</li>
<li>La <b>faiblesse des liens forts</b> et la <b>force des liens faibles</b></li>
<li>Aller au-devant des autres</li>
<li>Le réseau sourit aux audacieux</li>
</ol>

<h3>7. Optimiser son réseau</h3>
<ul>
<li>Diagnostiquer son réseau</li>
<li>La diversité ≠ principe de proximité (éviter le « réseau de clones »)</li>
<li>Détruire les barrières</li>
<li>Les <b>super connecteurs</b></li>
</ul>
<div class="key"><b>Q3C, le « SMIC » du réseauteur efficace</b> : <b>Q</b>ualité du projet/produits/services, <b>C</b>ompétence professionnelle, <b>C</b>ourtoisie, <b>C</b>onfiance.</div>

<h3>8. L'appel réseau</h3>
<p><b>Objectif : obtenir un rendez-vous.</b> L'entretien ne sert pas à obtenir un job mais à <b>recueillir des informations</b> sur le secteur. Checklist : 1. Bonjour + nom ; 2. rappel de la recommandation (qui vous a donné le contact)…</p>
<div class="tablewrap"><table class="laws">
<tr><th></th><th>Même secteur</th><th>Nouveau secteur</th></tr>
<tr><th>Même métier</th><td>Détection d'opportunités</td><td>Info secteur, validation du ciblage, détection d'opportunités</td></tr>
<tr><th>Nouveau métier</th><td>Info métier, validation du projet, détection d'opportunités</td><td>Info métier, info secteur, validation du projet, détection d'opportunités</td></tr>
</table></div>
`},

{ id:'c5', title:'La marque', sub:'Capital immatériel, plateforme de marque, prisme de Kapferer', html:`
<p>Exemple : <b>FIAT</b> = acronyme de <i>Fabbrica Italiana Automobili Torino</i> (Fabrique italienne d'automobiles de Turin).</p>

<h3>1. Le capital immatériel</h3>
<p>Ce qu'on ne peut pas toucher. Le <b>capital marque</b> attire des clients, et plus il y a de clients, plus il augmente. Il a un impact sur <b>10 composantes</b> :</p>
<div class="def">Clients · Humain · Organisation · Savoirs · SI (système d'information) · Fournisseurs · Marque (logo, nom…) · Actionnaires · Sociétal · Environnemental</div>

<h3>2. La marque employeur (7 éléments)</h3>
<p>Proposition · Expérience · Engagement · Talent · Réputation · Identité corporate · Communication</p>

<h3>3. La plateforme de marque : 10 questions clés</h3>
<ol>
<li><b>Définition</b> : comment définir mon entreprise, mon projet ?</li>
<li><b>Vision</b> : quelle vision de mon marché, de mon avenir ?</li>
<li><b>Mission</b> : quelle est la raison d'être de l'entreprise ?</li>
<li><b>Ambition</b> : vers quoi la marque souhaite-t-elle évoluer ?</li>
<li><b>Posture</b> : comment la marque se caractérise-t-elle ?</li>
<li><b>Personnalité</b> : quelles relations avec ses publics ?</li>
<li><b>Promesse</b> : que me propose concrètement la marque ?</li>
<li><b>Justification, preuves</b> : caractéristiques produit, histoire, témoignages</li>
<li><b>Ton et style</b> : léger, sérieux, institutionnel, classique, trendy, élégant</li>
<li><b>Contraintes</b> : charte graphique, budget, droit, timing</li>
</ol>

<h3>4. Le prisme d'identité de marque de Jean-Noël Kapferer</h3>
<p>6 facettes, regroupées par 2 :</p>
<div class="tablewrap"><table class="laws">
<tr><th>Groupe</th><th>Facette</th><th>Signification</th></tr>
<tr><td rowspan="2"><b>Image de l'organisation</b></td><td>Physique</td><td>Les caractéristiques objectives de la marque</td></tr>
<tr><td>Personnalité</td><td>La façon de parler de la marque</td></tr>
<tr><td rowspan="2"><b>Lien avec le public</b></td><td>Culture</td><td>Un système de valeurs</td></tr>
<tr><td>Relation</td><td>La relation entre les clients et la marque</td></tr>
<tr><td rowspan="2"><b>Image personnelle</b></td><td>Reflet</td><td>L'image de l'acheteur auquel la marque semble s'adresser</td></tr>
<tr><td>Mentalisation</td><td>La façon dont le consommateur de la marque se voit</td></tr>
</table></div>

<h3>5. Protéger sa marque</h3>
<ul>
<li><b>INPI</b> : Institut National de la Propriété Industrielle (France).</li>
<li><b>OMPI</b> : Organisation Mondiale de la Propriété Intellectuelle.</li>
</ul>
<div class="note-block">Ton document écrit « INPI = Institut National de la Propriété Intellectuelle ». Le nom officiel est Institut National de la Propriété <b>Industrielle</b>. Si le prof l'a dit autrement, suis sa version.</div>
`},

{ id:'c6', title:'Que sera demain ?', sub:'Typologies de pub, ère VUCA, émotion dans la comm', html:`
<h3>1. Les 3 typologies de publicité</h3>
<ul><li>Publicité de <b>marque</b></li><li>Publicité de <b>vente</b></li><li>Publicité <b>sociétale</b></li></ul>

<h3>2. L'ère VUCA</h3>
<div class="key"><b>V</b>olatilité · <b>U</b>ncertainty = <b>Incertitude</b> · <b>C</b>omplexité · <b>A</b>mbiguïté</div>
<p>Le monde change vite et de façon imprévisible : la communication doit s'adapter.</p>

<h3>3. La comm de demain</h3>
<ul>
<li><b>Réalité augmentée</b>…</li>

<h3>4. L'émotion dans la comm</h3>
<ul>
<li><b>FACS</b> (Facial Action Coding System) : système de codage des expressions du visage.</li>
<li>Environ <b>10 000 expressions faciales</b>, <b>38 muscles</b> faciaux (selon le cours).</li>
<li>On combine l'<b>analyse du visage</b> et le <b>verbatim</b> (les propos rapportés).</li>
</ul>
`},

{ id:'c7', title:'Prise de parole en public', sub:'3 registres, débit, structure du discours en 5 temps', html:`
<p>Le trac (stress) est normal (Sénèque). Méthodes : entrer sur scène avec le <b>sourire</b>, avoir des <b>pensées positives</b>.</p>

<h3>1. Les 3 registres</h3>
<ul>
<li><b>Expression corporelle</b> : posture, gestuelle, gestion de l'espace</li>
<li><b>Expression vocale</b> : la voix (« un orchestre »)</li>
<li><b>Expression orale</b>, dont le langage</li>
</ul>
<p><b>La confiance en vous</b> : en votre image ; positivez toujours (ce n'est pas le hasard, ça demande de la préparation).</p>

<h3>2. Le débit : ce qui le perturbe</h3>
<ul>
<li>Tension émotionnelle</li>
<li>Anticipation de l'idée suivante</li>
<li>Dévalorisation de soi</li>
<li>Manque de concentration</li>
<li>Indifférence par rapport à la phrase émise</li>
<li>Respiration trop rapide</li>
<li>Ne pas tenir compte du temps d'assimilation de l'auditoire</li>
</ul>

<h3>3. La structure du discours : 5 temps</h3>
<p>Le discours (en anglais : <b>pitch</b>) sert à <b>convaincre</b>.</p>
<div class="def"><b>1. L'exorde</b> (le commencement)<br>
• Exprimer sa <b>gratitude</b>, son bonheur de s'adresser à l'auditoire<br>
• <b>Situer l'enjeu</b> dès la première phrase<br>
• Ou l'<b>exorde par surprise</b> : commencer par des mots sans rapport apparent</div>
<div class="def"><b>2. La narration</b><br>C'est du <b>storytelling</b> : partir d'un récit personnel pour arriver à la thématique générale.</div>
<div class="def"><b>3. L'argumentation</b><br>
• Énoncer les arguments dans l'<b>ordre nestorien</b> : les plus <b>forts au début et à la fin</b>, les plus faibles au milieu.<br>
• Qualifier ses arguments, annoncer le plan, soigner les relances, ménager les transitions, ponctuer de conclusions partielles.<br>
• <b>3 ressorts</b> pour l'adhésion : <b>Cerveau</b> (« intellectuel » : réflexion, imagination, levier relationnel) ; <b>Cœur</b> (« affectif » : émotion, mémoire, levier émotionnel) ; <b>Corps</b> (« actif » : pulsions, levier factuel).</div>
<div class="def"><b>4. La réfutation</b><br>Démontrer que l'adversaire a tort ; se mettre dans la peau de l'opposant pour démonter ses arguments.</div>
<div class="def"><b>5. La péroraison</b> (la conclusion)<br>Résumer sa thèse, son engagement, insister sur son bien-fondé ; terminer <b>sans équivoque</b> (ton et mots). 2 possibilités : finir <b>vers le haut</b> ou <b>vers le bas</b>.</div>

<h3>4. Préparer en amont</h3>
<p>Questions à se poser : <b>à qui ? pourquoi ? comment ? quel mode ? combien de temps ? où ?</b></p>
<p>Vos amis durables : le <b>dictionnaire</b>. Le message essentiel du début à la fin. La <b>répétition</b>.</p>

<h3>5. Règles d'usage pour se présenter (TD3)</h3>
<ol>
<li>Préparez ce que vous allez dire</li>
<li>Libérez votre cage thoracique et votre abdomen</li>
<li>Prenez une grande respiration et articulez, fort</li>
<li>Le prénom en premier</li>
<li>Aidez à mémoriser votre nom</li>
<li>Votre regard éclaire vos paroles</li>
</ol>

<h3>6. L'exercice en équipes</h3>
<p>Équipes tirées au sort (chevalets de couleur), un <b>porte-parole</b> choisi, une thématique parmi la liste des joutes, discours travaillé tous ensemble, durée fixe <b>4 min ± 15 s</b>. Deux groupes : les <b>tribuns de la plèbe</b> et les <b>orateurs grecs</b>.</p>
`},

{ id:'c8', title:'Rappel : 1er contrôle', sub:'Organisation, domaines de comm, média/hors média, crise, logo', html:`
<div class="note-block">Ce chapitre résume la partie du <b>1er contrôle</b> (avant « 1er contrôle FIN » dans ton document). À revoir si le prof fait un contrôle cumulatif.</div>

<h3>1. L'organisation de l'entreprise</h3>
<p><b>5 éléments de base</b> : le chef (sommet stratégique), le centre opérationnel, la ligne hiérarchique, la technostructure, le support logistique (RH, sécurité, comm).</p>
<p><b>3 organisations</b> : fonctionnelle (par métiers), divisionnelle (par secteurs d'activité), matricielle (par projet).</p>
<p><b>Qui fait la comm ?</b> Externaliser (agence, freelance) ou internaliser (1 ou 2 employés, service comm). Souvent le patron ou la patronne.</p>

<h3>2. Les 8 domaines de communication</h3>
<div class="tablewrap"><table class="laws">
<tr><th>Domaine</th><th>Vers qui / pour quoi</th></tr>
<tr><td>Interne</td><td>salariés, collaborateurs, stagiaires, prestataires</td></tr>
<tr><td>Externe</td><td>médias, clients, partenaires</td></tr>
<tr><td>Institutionnelle (corporate)</td><td>citoyens ; promotion de l'entreprise et de ses valeurs</td></tr>
<tr><td>De marque</td><td>notoriété, spécificités, capital de marque</td></tr>
<tr><td>Marketing</td><td>produits et services, créer le besoin d'achat</td></tr>
<tr><td>Événementielle</td><td>image, prestige, capital sympathie, confiance</td></tr>
<tr><td>Financière</td><td>actionnaires, partenaires</td></tr>
<tr><td>De recrutement</td><td>CDD/CDI, apprentissage, viviers de candidats</td></tr>
</table></div>

<h3>3. Média et hors média</h3>
<ul>
<li><b>Média</b> = achat d'espace publicitaire : affichage (abribus, panneaux, caddies, OOH/DOOH), presse (PQN : L'Équipe ; PQR : Nice-Matin), cinéma, radio, Internet, podcasts.</li>
<li><b>Hors média</b> = tout le reste : street marketing (ISA, flash mob…), événementiel, mécénat/sponsoring, relations publiques, promotion des ventes (jeu-concours, réductions, échantillons), goodies, papiers d'entreprise.</li>
</ul>
<p><b>Mécénat</b> : pas de pub, avantage fiscal (convention, déduction de 60 % de l'IS dans la limite de 0,05 % du CA). <b>Sponsoring</b> : de la pub (contrat, facturation, coût intégré aux charges).</p>

<h3>4. La communication de crise</h3>
<p><b>Échelle</b> : incident (interne) → accident (conséquences externes) → crise (parties prenantes, réputation) → catastrophe (nombreuses victimes, pouvoirs publics).</p>
<p><b>2 règles</b> : une bonne comm ne garantit pas que tout ira bien, une mauvaise garantit que tout ira mal ; si l'entreprise ne parle pas, d'autres le feront à sa place.</p>
<p><b>4 stratégies</b> : nier la crise, détourner l'attention, reconnaître les faits, centrer sur les solutions.</p>
<p><b>Ordre des sujets</b> : 1. les personnes (victimes) ; 2. les dommages matériels ; 3. les pertes financières ; 4. une attitude responsable (cellule de crise).</p>

<h3>5. Le logo</h3>
<p><b>4 éléments</b> : nom, symbole, système de couleurs, code graphique.</p>
<p><b>6 qualités</b> : <b>FEU</b> (Fédérateur, Évocateur, Unique) + <b>DPI</b> (Déclinable, Projectif, Intemporel).</p>
<p><b>3 phases de l'impact visuel</b> : 1. la couleur ; 2. la forme ; 3. on lit le texte. Durée de vie : 5 à 7 ans.</p>
`}
  ]
});

// Explications simples + astuces pour retenir les listes — Communication for Business
SIMPLE.c1 = `
<p class="lead">Les <b>relations presse</b>, c'est convaincre des journalistes de parler de toi <b>gratuitement</b>. Comme ils reçoivent des centaines de messages par jour, tout doit être <b>court, clair et facile à reprendre</b>.</p>
<h3>Le communiqué de presse = une annonce en une page</h3>
<p>Imagine que tu ouvres un nouveau café. Le communiqué, c'est la feuille que tu envoies au journal local.</p>
<ul>
<li>En haut : « COMMUNIQUÉ DE PRESSE », ton <b>logo</b>, la <b>date</b>, un <b>titre</b> qui dit tout.</li>
<li>Juste dessous, le <b>chapô</b> : le résumé qui répond aux <b>5 W</b>.</li>
<li>En bas : « <b>À propos</b> » (qui tu es + site web) et les <b>contacts presse</b>.</li>
</ul>
<div class="key"><b>Retenir les 5 W</b> : un journaliste pressé veut savoir <b>Qui ? Quoi ? Où ? Quand ? Pourquoi ?</b> (Who, What, Where, When, Why). Le chapô fait 5 lignes max, 250 à 350 signes.</div>
<div class="ex"><i>« Lucie Martin (Who) ouvre Le Petit Grain (What), un café-librairie à Nice (Where), le 3 décembre (When), pour proposer un lieu calme aux étudiants (Why). »</i></div>
<h3>Les conseils, en 4 idées</h3>
<ul>
<li><b>Clair</b> : l'info principale dès le titre, phrases courtes S-V-C, pas de jargon.</li>
<li><b>Neutre</b> : 3ᵉ personne, présent, <b>pas de superlatifs</b> (« incroyable », « révolutionnaire »).</li>
<li><b>Concret</b> : des chiffres mis en scène (%, comparaisons).</li>
<li><b>Partageable</b> : photos, vidéos, liens. Et ne jamais oublier logo + contacts.</li>
</ul>
<p>Astuce des temps : <b>Quoi</b> = présent, <b>Pourquoi</b> = passé, <b>Vers quoi</b> = futur.</p>
<h3>Le dossier de presse = la version longue</h3>
<p>Page de garde, puis dans l'ordre : <b>mot du PDG → présentation → revue de presse → chiffres → contacts</b>. Le chef parle d'abord, on présente, on montre ce que les autres ont dit, on prouve par les chiffres, on dit comment joindre.</p>
<h3>Les 5 rencontres avec la presse</h3>
<div class="dict">
<div><span>Conférence de presse</span><p>Beaucoup de journalistes d'un coup. Ordre : VIP, porte-parole, autres. 15-20 min de discours + 20 min de questions.</p></div>
<div><span>Déjeuner de presse</span><p>Petit groupe, décontracté, rapide et pas cher.</p></div>
<div><span>Voyage de presse</span><p>On emmène les journalistes ailleurs pour créer une relation privilégiée. Logistique parfaite, déontologie stricte.</p></div>
<div><span>One-to-one</span><p>Un seul journaliste, souvent une première rencontre.</p></div>
<div><span>Portage</span><p>On envoie un produit ou un échantillon, avec un CP ou un dossier de presse.</p></div>
</div>
<div class="key">Astuce : <b>« Ce Déjeuner Voyage en One-to-one Portable »</b> → Conférence, Déjeuner, Voyage, One-to-one, Portage.</div>
`;

SIMPLE.c2 = `
<p class="lead">Le <b>plan de communication</b>, c'est le <b>programme de l'année</b> : toutes les actions de comm prévues, avec un calendrier. On le prépare l'année N-1 pour l'année N.</p>
<div class="key"><b>Le mot à retenir : C.O.M.M.</b><br><b>C</b>ibles → à qui je parle ?<br><b>O</b>bjectifs → qu'est-ce que je veux obtenir ?<br><b>M</b>essages → qu'est-ce que je dis ?<br><b>M</b>édias → par où je passe ?</div>
<h3>Les 4 outils pour la cible : 4P, 4C, SAVE, 4E</h3>
<p>Ce sont 4 versions de la même grille, de plus en plus modernes. Chaque ligne parle de la même chose vue autrement :</p>
<div class="tablewrap"><table class="laws">
<tr><th>Idée</th><th>4P</th><th>4C</th><th>SAVE</th><th>4E</th></tr>
<tr><td>Ce qu'on vend</td><td>Produit</td><td>Consommateur</td><td>Solution</td><td>Émotion</td></tr>
<tr><td>Où on le trouve</td><td>Place</td><td>Commodité</td><td>Accès</td><td>Expérience</td></tr>
<tr><td>Combien</td><td>Prix</td><td>Coût</td><td>Valeur</td><td>Exclusivité</td></tr>
<tr><td>Comment on en parle</td><td>Promotion</td><td>Communication</td><td>Éducation</td><td>Engagement</td></tr>
</table></div>
<div class="key">Astuce <b>SAVE</b> : c'est déjà un mot (« sauver »). <b>4E</b> : « <b>É</b>mue, l'<b>E</b>xpérience <b>E</b>xclusive m'<b>E</b>ngage ».</div>
<h3>Les 3 objectifs : savoir, aimer, agir</h3>
<p>C'est l'ordre naturel : on doit d'abord <b>connaître</b> une marque, puis l'<b>aimer</b>, puis <b>agir</b> (acheter).</p>
<div class="ex">Le restaurant : « Je connais » = notoriété (cognitif). « C'est bon » = image (affectif). « J'y vais tout le temps, je l'adore » = réputation (conatif).</div>
<p>Pour retenir les mots savants : <b>co<u>gn</u>itif</b> comme « co<b>nn</b>aître », <b>affectif</b> comme « affection », <b>co<u>n</u>atif</b> comme « action ».</p>
<h3>Les 4 éléments du message</h3>
<p>Comme un vendeur : je te <b>promets</b> quelque chose, je te dis ce que tu y <b>gagnes</b>, je te donne des <b>arguments</b>, avec le bon <b>ton</b>.</p>
<div class="key">Promesse · Bénéfice client · Arguments · Style et ton → <b>« PBAS »</b></div>
<h3>Mesurer : le ROI</h3>
<p>ROI = (ce qu'on a gagné − ce qu'on a dépensé) / ce qu'on a dépensé × 100. Problème : on ne sait jamais vraiment si les clients ont acheté <b>grâce</b> à la campagne. C'est pour ça que le plan de comm est souvent le premier coupé quand le budget baisse.</p>
`;

SIMPLE.c3 = `
<p class="lead">Le <b>plan média</b>, c'est un morceau du plan de comm : <b>où et quand</b> on achète de l'espace publicitaire (radio, affiches, TV…). Le plan de comm = tout ; le plan média = seulement la pub payante.</p>
<h3>Les 5 règles de base</h3>
<div class="key">Astuce <b>« CFRSJ »</b> : <b>C</b>onsommateur d'abord · <b>F</b>lexible · <b>R</b>éaliste (SMART) · <b>S</b>imple · à <b>J</b>our.</div>
<h3>Le marché cible : les 4C (encore !)</h3>
<p>Ici, ce sont les <b>4 publics</b> à qui une entreprise parle :</p>
<ul>
<li><b>Consommateurs</b> → ceux qui achètent</li>
<li><b>Collaborateurs</b> → les salariés (comm interne)</li>
<li><b>Citoyens</b> → le grand public (comm institutionnelle)</li>
<li><b>Capitaux</b> → les actionnaires (comm financière)</li>
</ul>
<div class="trap">Ne mélange pas avec les 4C du plan de comm (Consommateur, Coût, Commodité, Communication). Si la question parle de « marché cible » ou du plan média → Consommateurs, Collaborateurs, Citoyens, Capitaux.</div>
<h3>Les 4 objectifs du plan média</h3>
<p>Pense à une pub radio : <b>quand</b> la diffuser (période), <b>combien de gens</b> l'entendront (audience cumulée), <b>combien de fois</b> (répétition), <b>dans quelle zone</b> (couverture géographique).</p>
<h3>Les 4 contraintes</h3>
<div class="key">Astuce <b>« FJED »</b> : <b>F</b>inancières · <b>J</b>uridiques · <b>E</b>mplacement · <b>D</b>élai de fabrication.<br>Pense à une affiche : il faut l'argent, avoir le droit, que l'emplacement soit libre, et le temps de l'imprimer.</div>
`;

<p class="lead">Le message du chapitre : <b>la plupart des emplois se trouvent grâce au réseau</b> (70 % des offres, 2 postes de cadre sur 3). Il faut donc construire son réseau, l'organiser et l'entretenir.</p>
<h3>Les 5 finalités : un escalier</h3>

<div class="key">Astuce : « <b>C</b>onnu, <b>R</b>éférence, <b>I</b>nfo, <b>F</b>ormation, <b>P</b>artage » → « <b>C'est Rare, Il Faut Partager</b> ».</div>
<h3>Ton premier réseau existe déjà</h3>
<p>Famille, amis, relations d'études et pro, contacts sur les réseaux sociaux. Pour savoir si quelqu'un est vraiment un contact utile, pose-toi 4 questions : puis-je le contacter ? M'écoutera-t-il ? M'aidera-t-il si je demande quelque chose de raisonnable ? Et moi, l'aiderais-je ?</p>
<h3>Les 5 atouts</h3>
<div class="key">Astuce : « <b>Carte, Agenda, Déjeuners, Vœux, Bande-annonce</b> » → <b>« CADVB »</b>. Les 5 se suivent comme une année : on se présente (carte), on s'organise (agenda), on mange avec du monde (2+2+1), on souhaite la bonne année (vœux), on se présente à l'oral (bande-annonce).</div>
<p><b>Le 2 + 2 + 1</b> : chaque semaine, 2 déjeuners avec des gens de l'extérieur, 2 avec des collègues qu'on connaît peu, 1 avec des proches. Ne jamais déjeuner seul.</p>
<p><b>La bande-annonce</b> = ton pitch de 30 secondes. 4 règles : <b>clair, concis, impactant, spécifique</b>. Une partie <b>rationnelle</b> (qui je suis, ce que je fais, pour qui, mes preuves) et une partie <b>émotionnelle</b> (mon histoire, ce que j'aime, mon rêve).</p>
<h3>Les 2 fléaux</h3>
<p>Le <b>réseau kleenex</b> : contacter les gens seulement quand on a besoin d'eux, puis les oublier. Et les <b>toxiques</b> : ceux qui prennent sans jamais donner.</p>
<h3>L'esprit réseau</h3>
<p>La phrase magique : <b>« En quoi puis-je vous aider ? »</b> On donne avant de demander.</p>
<p>4 qualités : <b>Partage, Bienveillance, Solidarité, Entraide</b>. Astuce : « <b>P'tit Bisou Sans Effort</b> ».</p>
<p><b>La force des liens faibles</b> : ce sont souvent les connaissances lointaines (pas les proches) qui t'apportent une info nouvelle, car tes proches savent les mêmes choses que toi.</p>
<div class="key"><b>Q3C</b> = le minimum vital (« SMIC ») du bon réseauteur : <b>Q</b>ualité, <b>C</b>ompétence, <b>C</b>ourtoisie, <b>C</b>onfiance.</div>
<h3>L'appel réseau</h3>
<p>On appelle quelqu'un recommandé par un contact, <b>pas pour demander un job</b>, mais pour <b>s'informer</b> sur son métier ou son secteur. Le but de l'appel : décrocher un <b>rendez-vous</b>.</p>
`;

SIMPLE.c5 = `
<p class="lead">Une marque, c'est bien plus qu'un logo : c'est une <b>valeur invisible</b> (capital immatériel) qui fait que les clients choisissent une entreprise plutôt qu'une autre.</p>
<h3>Le capital immatériel</h3>
<p>Tout ce qui a de la valeur mais qu'on ne peut pas toucher. Une marque forte attire les clients, motive les salariés, rassure les fournisseurs et les actionnaires… 10 composantes : clients, humain, organisation, savoirs, SI, fournisseurs, marque, actionnaires, sociétal, environnemental.</p>
<h3>La plateforme de marque : la « carte d'identité » de la marque</h3>
<p>10 questions, de la plus profonde à la plus concrète. Imagine que tu crées la marque de ton café :</p>
<div class="dict">
<div><span>Définition, Vision, Mission, Ambition</span><p>Qui suis-je, comment je vois l'avenir, pourquoi j'existe, où je veux aller.</p></div>
<div><span>Posture, Personnalité</span><p>Comment je me comporte et quelle relation j'ai avec mes clients.</p></div>
<div><span>Promesse, Preuves</span><p>Ce que je promets concrètement, et ce qui le prouve.</p></div>
<div><span>Ton et style, Contraintes</span><p>Comment je parle, et les limites (budget, charte graphique, droit, délais).</p></div>
</div>
<div class="key">Astuce : « <b>De Vieux Moines Aiment Prier Pour Prouver Toute Croyance</b> » → Définition, Vision, Mission, Ambition, Posture, Personnalité, Promesse, Preuves, Ton, Contraintes.</div>
<h3>Le prisme de Kapferer : 6 facettes</h3>
<p>Imagine un hexagone. À gauche ce que la marque <b>émet</b>, à droite ce que le client <b>reçoit</b>.</p>
<ul>
<li><b>Physique</b> : ce qu'on voit (logo, produits, couleurs).</li>
<li><b>Personnalité</b> : sa façon de parler (drôle, sérieuse…).</li>
<li><b>Culture</b> : ses valeurs.</li>
<li><b>Relation</b> : le lien avec ses clients.</li>
<li><b>Reflet</b> : l'image du client « typique » que la marque montre.</li>
<li><b>Mentalisation</b> : comment le client se voit en utilisant la marque.</li>
</ul>
<div class="key">Astuce : <b>« PPCRRM »</b> → « <b>Papa Prend Cinq Rondelles Rouges Molles</b> » : Physique, Personnalité, Culture, Relation, Reflet, Mentalisation.</div>
`;

SIMPLE.c6 = `
<p class="lead">Un petit chapitre sur le futur de la communication. Il faut surtout retenir <b>3 typologies de pub</b> et l'acronyme <b>VUCA</b>.</p>
<h3>3 typologies de publicité</h3>
<ul><li><b>De marque</b> : faire aimer la marque (une pub Coca-Cola sans produit précis).</li><li><b>De vente</b> : faire acheter un produit (« -30 % ce week-end »).</li><li><b>Sociétale</b> : défendre une cause (environnement, sécurité routière).</li></ul>
<h3>VUCA : le monde d'aujourd'hui</h3>
<div class="key"><b>V</b>olatilité (ça change vite) · <b>U</b>ncertainty = Incertitude (on ne sait pas ce qui va arriver) · <b>C</b>omplexité (tout est lié) · <b>A</b>mbiguïté (rien n'est clair).</div>
<h3>L'émotion</h3>
<p>Les marques cherchent à mesurer nos émotions en analysant notre visage : le système <b>FACS</b> code environ 10 000 expressions grâce aux muscles du visage. On le combine avec ce que les gens disent (le <b>verbatim</b>).</p>
`;

SIMPLE.c7 = `
<p class="lead">Parler en public, ça se travaille. Le cours donne une <b>méthode</b> : soigner 3 registres, maîtriser son débit, et construire son discours en <b>5 temps</b> (hérité des orateurs antiques).</p>
<h3>Les 3 registres</h3>
<p>Ton <b>corps</b> (posture, gestes, déplacements), ta <b>voix</b> (volume, rythme), tes <b>mots</b> (le langage). Les 3 doivent dire la même chose.</p>
<div class="key">Astuce : <b>« Corps, Voix, Mots »</b> → corporelle, vocale, orale.</div>
<h3>Pourquoi on parle trop vite</h3>
<p>Le stress (tension émotionnelle), on pense déjà à la phrase suivante, on se dévalorise, on manque de concentration, on ne s'intéresse plus à ce qu'on dit, on respire trop vite, et on oublie que le public a besoin de temps pour comprendre.</p>
<h3>Les 5 temps du discours</h3>
<div class="dict">
<div><span>1. Exorde</span><p>L'<b>ouverture</b> : remercier, annoncer l'enjeu, ou surprendre.</p></div>
<div><span>2. Narration</span><p>Raconter une <b>histoire</b> (storytelling) qui amène au sujet.</p></div>
<div><span>3. Argumentation</span><p>Les <b>arguments</b> : les forts au début et à la fin, les faibles au milieu (ordre nestorien). Toucher le cerveau, le cœur et le corps.</p></div>
<div><span>4. Réfutation</span><p>Répondre d'avance aux <b>objections</b> de l'adversaire.</p></div>
<div><span>5. Péroraison</span><p>La <b>conclusion</b> : résumer et finir clairement, vers le haut ou vers le bas.</p></div>
</div>
<div class="key">Astuce : <b>« En Novembre, Arnault Refait Pâques »</b> → Exorde, Narration, Argumentation, Réfutation, Péroraison.</div>
<p><b>Les 3 ressorts de l'argumentation</b> : le <b>cerveau</b> (la raison), le <b>cœur</b> (l'émotion), le <b>corps</b> (l'action, l'envie). Un bon argument touche les trois.</p>
<h3>Se présenter (TD3)</h3>
<p>Préparer, respirer, articuler fort, dire <b>son prénom en premier</b>, aider à retenir son nom, et <b>regarder</b> son public.</p>
`;

// ---------- stockage (sur le téléphone) ----------
const KEY = 'revisions-miage-v1';
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch(e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} };
// État de l'appareil (matière choisie, mode invité, dernier utilisateur, caches)
let device = Object.assign({ subject:'proba', guest:false, user:null, exams:[], packs:[] }, lsGet(KEY + ':device') || {});
const saveDevice = () => lsSet(KEY + ':device', device);
// Progression : une par utilisateur (ou « invité »)
let store = { stats:{}, pending:{} };
function loadStore() {
  const uid = device.user ? device.user.id : 'guest';
  let s = lsGet(KEY + ':' + uid);
  if (!s) { const old = lsGet(KEY); s = old && old.stats ? { stats: old.stats, pending: Object.assign({}, old.stats) } : null; } // reprise de l'ancienne version
  store = Object.assign({ stats:{}, pending:{} }, s || {});
  store.subject = device.subject;
}
const save = () => { lsSet(KEY + ':' + (device.user ? device.user.id : 'guest'), { stats: store.stats, pending: store.pending }); device.subject = store.subject; saveDevice(); };
loadStore();

const subj = () => SUBJECTS.find(s => s.id === store.subject) || SUBJECTS[0];
const qsOf = (sid) => QUESTIONS.filter(q => q.s === sid);
const chapterOf = (q) => SUBJECTS.find(s => s.id === q.s).chapters.find(c => c.id === q.c);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const isMastered = id => { const s = store.stats[id]; return s && s.last === true; };
const isWrong = id => { const s = store.stats[id]; return s && s.last === false; };
const fmtErr = e => { const m = (e && (e.message || e.error_description)) || String(e); return /Invalid login/i.test(m) ? 'E-mail ou mot de passe incorrect.' : /already registered|already exists/i.test(m) ? 'Un compte existe déjà avec cet e-mail : connecte-toi.' : /Password should/i.test(m) ? 'Mot de passe trop court (6 caractères minimum).' : /Email not confirmed/i.test(m) ? 'Confirme ton e-mail (regarde ta boîte de réception), puis connecte-toi.' : /Failed to fetch|NetworkError|network/i.test(m) ? 'Pas de connexion internet.' : m; };

function go(v, push = true) { if (push) history.push(view); view = v; render(); window.scrollTo(0, 0); }
function back() { view = history.pop() || { name:'home' }; render(); }

  $('#title').textContent = title;

}

  const S = subj();
  ['proba','ng','comm'].forEach(k => document.body.classList.toggle('s-' + k, S.id === k));

}

// ---------- Accueil : choix de la matière + examens à venir ----------
const DAY = 86400000;
function daysUntil(d) { const t = new Date(); t.setHours(0,0,0,0); return Math.round((new Date(d + 'T00:00:00') - t) / DAY); }
function whenLabel(n) { return n === 0 ? 'Aujourd\'hui' : n === 1 ? 'Demain' : 'Dans ' + n + ' jours'; }
function frDate(d) { try { return new Date(d + 'T00:00:00').toLocaleDateString('fr-FR', { weekday:'long', day:'numeric', month:'long' }); } catch(e) { return d; } }
function subjectProgress(S) { const qs = qsOf(S.id); const done = qs.filter(q => isMastered(q.id)).length; return { done, total: qs.length, pct: qs.length ? Math.round(100 * done / qs.length) : 0 }; }
function chooseSubject(id) { store.subject = id; save(); history = []; go({ name:'subject' }, false); }
function vHome(m) {

  const eh = el('h3', 'sect', 'Examens à venir'); m.append(eh);
  if (!ex.length) m.append(el('p', 'sub', Cloud.enabled() ? 'Aucun examen prévu pour l\'instant.' : 'Les examens à venir s\'afficheront ici une fois les comptes activés.'));
  else {
    const st = el('div', 'stack');
    ex.forEach(e => {
      const S = SUBJECTS.find(s => s.id === e.subject); const n = daysUntil(e.exam_date);
      const b = el('button', 'row exam' + (n <= 3 ? ' soon' : ''));
      b.innerHTML = '<div class="when"><b></b><span></span></div><div class="t"><b></b><span></span></div><div class="chev">›</div>';
      b.querySelector('.when b').textContent = n === 0 ? 'J' : n === 1 ? 'J-1' : 'J-' + n;
      b.querySelector('.when span').textContent = whenLabel(n);
      b.querySelector('.t b').textContent = e.title + (S ? ' · ' + S.short : '');
      b.querySelector('.t span').textContent = frDate(e.exam_date) + (e.details ? ' — ' + e.details : '');
      b.onclick = () => { if (S) chooseSubject(S.id); };
      st.append(b);
    });
    m.append(st);
  }
  // Matières
  m.append(el('h3', 'sect', 'Choisis ta matière'));
  const g = el('div', 'subjects');

    const p = subjectProgress(S);
    const b = el('button', 'subj s-' + S.id);
    if (S.color) b.style.setProperty('--accent', S.color);
    b.innerHTML = '<span class="code"></span><b></b><span class="meta"></span><div class="bar dk"><i></i></div>';
    b.querySelector('.code').textContent = S.code || S.short;
    b.querySelector('b').textContent = S.name;
    b.querySelector('.meta').textContent = S.chapters.length + ' chapitres · ' + p.total + ' questions · ' + p.pct + ' %';
    b.querySelector('.bar i').style.width = p.pct + '%';
    b.onclick = () => chooseSubject(S.id);
    g.append(b);
  });
  m.append(g);
  const inst = el('div', 'card install'); inst.style.marginTop = '22px';
  inst.innerHTML = '<b>Réviser hors ligne</b><p style="margin:6px 0 0">Installe l\'app <b>avec internet</b> : Safari → Partager → <b>Sur l\'écran d\'accueil</b>. Ouvre-la une fois, puis elle marche en mode avion. Ta progression se synchronise dès que tu retrouves du réseau.</p>';
  m.append(inst);
}
function vSubject(m) {
  const S = subj(), qs = qsOf(S.id);
  setTop(S.name, true);
  const done = qs.filter(q => isMastered(q.id)).length;
  const pct = qs.length ? Math.round(100 * done / qs.length) : 0;
  const hero = el('div', 'card hero');

// ---------- Synchronisation ----------
let syncTimer = null, syncing = false;
function syncSoon() { clearTimeout(syncTimer); syncTimer = setTimeout(sync, 1500); }
async function sync() {
  if (syncing || !device.user || !Cloud.enabled() || !Cloud.online()) return;
  const ids = Object.keys(store.pending); if (!ids.length) return;
  syncing = true;
  const rows = ids.filter(id => store.stats[id]).map(id => { const s = store.stats[id]; return { qid:id, ok:s.ok || 0, ko:s.ko || 0, last:s.last == null ? null : s.last, updated_at:new Date(s.t || Date.now()).toISOString() }; });
  const done = await Cloud.pushProgress(device.user.id, rows);
  if (done) { ids.forEach(id => delete store.pending[id]); save(); }
  syncing = false;
}
async function pull() {
  if (!device.user || !Cloud.enabled() || !Cloud.online()) return;
  const rows = await Cloud.pullProgress(device.user.id); if (!rows) return;
  rows.forEach(r => { const t = Date.parse(r.updated_at) || 0, l = store.stats[r.qid]; if (!l || (l.t || 0) < t) { store.stats[r.qid] = { ok:r.ok, ko:r.ko, last:r.last, t }; delete store.pending[r.qid]; } });
  save(); sync();
}

  if (changed) { saveDevice(); if (['home','admin'].includes(view.name)) render(); }
}

  const go1 = el('button', 'btn', 'Analyser le cours');
  go1.onclick = async () => {
    msg.hidden = true;
    if (!files.files.length) return msg.show('Ajoute au moins un fichier.');
    if (st.subject === 'new' && !st.name.trim()) return msg.show('Donne un nom à la matière.');
    go1.disabled = true; go1.textContent = 'Lecture des fichiers…';
    try {
      st.sources = []; for (const f of files.files) st.sources.push(await readSource(f));
      const size = JSON.stringify(st.sources).length; if (size > 25e6) throw new Error('Fichiers trop lourds au total (25 Mo max). Envoie-les en plusieurs fois.');
      st.subjectObj = st.subject === 'new'
        ? { id: (norm(st.short || st.name).trim().replace(/\s+/g, '-').slice(0, 20) || 'matiere') + '-' + Date.now().toString(36).slice(-3), name: st.name.trim(), short: (st.short || st.name).trim().slice(0, 12), code: st.code.trim(), color: ['#b45309','#7c3aed','#0369a1','#be185d','#4d7c0f'][Math.floor(Math.random() * 5)] }
        : (S => ({ id:S.id, name:S.name, short:S.short, code:S.code }))(SUBJECTS.find(x => x.id === st.subject));
      go1.textContent = 'L\'IA lit le cours… (jusqu\'à 1 minute)';
      const r = await Cloud.generate({ mode:'outline', subject:st.subjectObj, sources:st.sources, notes:st.notes, style:st.style });
      st.outline = (r.chapters || []).map((c, i) => Object.assign({ on:true, id:'ch' + (i + 1) }, c));
      if (!st.outline.length) throw new Error('L\'IA n\'a proposé aucun chapitre.');
      st.step = 'outline'; render();
    } catch (e) { msg.show(fmtErr(e)); go1.disabled = false; go1.textContent = 'Analyser le cours'; }
  };
  box.append(go1);
  box.append(el('p', 'sub', 'Coût : la génération utilise ta clé d\'API Claude (facturée à l\'usage, généralement quelques dizaines de centimes à quelques euros par cours selon sa longueur).'));
  return box;
}
function genProgress(box) {
  const st = gen;
  if (st.step === 'outline') {
    box.append(el('p', 'sub', 'Plan proposé pour « ' + st.subjectObj.name + ' ». Décoche les chapitres inutiles, puis lance la rédaction.'));
    st.outline.forEach((c, i) => { const lab = el('label', 'check' + (c.on ? ' on' : '')); const cb = el('input'); cb.type = 'checkbox'; cb.checked = c.on; cb.id = 'oc-' + i; cb.onchange = () => { c.on = cb.checked; lab.classList.toggle('on', cb.checked); }; const t = el('span'); t.append(el('b', null, (i + 1) + '. ' + c.title)); t.append(el('span', 'sub block', c.sub)); lab.append(cb, t); box.append(lab); });
    const msg = msgBox(); box.append(msg);
    const go2 = el('button', 'btn', 'Rédiger les chapitres');
    go2.onclick = () => { if (!st.outline.some(c => c.on)) return msg.show('Garde au moins un chapitre.'); st.step = 'writing'; st.done = []; st.idx = 0; st.err = null; render(); runGeneration(); };
    const cancel = el('button', 'btn ghost', 'Annuler'); cancel.onclick = () => { gen = null; render(); };
    box.append(go2, cancel); return box;
  }
  const chs = st.outline.filter(c => c.on);
  if (st.step === 'writing') {
    const pr = el('div', 'prog'); const pi = el('i'); pi.style.width = (100 * st.done.length / chs.length) + '%'; pr.append(pi); box.append(pr);
    box.append(el('p', null, st.err ? 'Arrêt au chapitre ' + (st.done.length + 1) + '.' : 'Rédaction du chapitre ' + Math.min(st.done.length + 1, chs.length) + ' / ' + chs.length + ' : ' + ((chs[st.done.length] || {}).title || '') + (st.phase ? ' (' + st.phase + ')' : '') + '…'));
    box.append(el('p', 'sub', 'Garde cette page ouverte. Chaque chapitre prend environ 1 à 2 minutes.'));
    if (st.err) { box.append(el('p', 'formmsg bad', st.err)); const r = el('button', 'btn', 'Réessayer ce chapitre'); r.onclick = () => { st.err = null; render(); runGeneration(); }; box.append(r); }
    const cancel = el('button', 'btn ghost', 'Annuler'); cancel.onclick = () => { gen = null; render(); }; box.append(cancel);
    return box;
  }
  if (st.step === 'review') {
    const v = Packs.validate(st.pack);
    box.append(el('p', 'formmsg ' + (v.ok ? 'good' : 'bad'), v.ok ? 'Prêt : ' + v.summary.chapters + ' chapitres, ' + v.summary.questions + ' questions (' + v.summary.counts.qcm + ' QCM, ' + v.summary.counts.list + ' « Citez », ' + v.summary.counts.open + ' ouvertes).' : 'Problème : ' + v.errors.join(' · ')));
    st.pack.chapters.forEach(c => { const d = el('details', 'prevch'); d.append(el('summary', null, c.title)); const b = el('div', 'course'); b.innerHTML = Packs.clean(c.simple); d.append(b); box.append(d); });
    const msg = msgBox(); box.append(msg);
    const pub = el('button', 'btn', 'Publier pour la classe'); pub.disabled = !v.ok; pub.onclick = () => publishPack(st.pack, pub, msg);
    const cancel = el('button', 'btn ghost', 'Abandonner'); cancel.onclick = () => { gen = null; render(); };
    box.append(pub, cancel); return box;
  }
  return box;
}
async function runGeneration() {
  const st = gen; const chs = st.outline.filter(c => c.on);
  while (gen === st && st.done.length < chs.length) {
    const c = chs[st.done.length];
    const base = { subject:st.subjectObj, sources:st.sources, outline:chs, chapter:c, style:st.style, count:st.count, notes:st.notes };
    try {
      st.phase = 'cours'; if (view.name === 'admin') render();
      const a = st.partial && st.partial.id === c.id ? st.partial : Object.assign({ id:c.id }, await Cloud.generate(Object.assign({ mode:'content' }, base)));
      st.partial = a; st.phase = 'questions'; if (view.name === 'admin') render();
      const q = await Cloud.generate(Object.assign({ mode:'questions' }, base));
      st.done.push({ chapter:{ id:c.id, title:c.title, sub:c.sub, simple:a.simple, html:a.html }, questions:(q.questions || []).map(x => Object.assign({}, x, { chapter:c.id })) });
      st.partial = null; st.phase = null;
    } catch (e) { st.err = fmtErr(e); if (view.name === 'admin') render(); return; }
  }
  if (gen !== st) return;
  // nettoyage des questions renvoyées par l'IA
  const qs = [];
  st.done.forEach(d => d.questions.forEach(q => {
    const t = q.type; const o = { type:t, chapter:q.chapter, q:q.q };
    if (t === 'qcm' && Array.isArray(q.options) && q.options.length >= 2) { o.options = q.options; o.answer = Math.max(0, Math.min(q.options.length - 1, parseInt(q.answer, 10) || 0)); o.explanation = q.explanation || ''; if (Array.isArray(q.notes) && q.notes.length === q.options.length) o.notes = q.notes; }
    else if (t === 'list' && Array.isArray(q.items) && q.items.length) { o.items = q.items; o.need = Math.max(1, Math.min(q.items.length, parseInt(q.need, 10) || q.items.length)); o.tip = q.tip || ''; }
    else if (t === 'open' && q.answer) { o.answer = String(q.answer); o.tip = q.tip || ''; }
    else return;
    if (q.source) o.source = String(q.source);
    qs.push(o);
  }));
  st.pack = { format:'revisions-pack-1', title:st.subjectObj.name + (st.subject === 'new' ? '' : ' (ajout)'), subject:st.subjectObj, chapters:st.done.map(d => d.chapter), questions:qs };
  st.step = 'review'; if (view.name === 'admin') render();
}
async function adminMembers(m) {
  const holder = el('div', 'stack'); holder.append(el('p', 'sub', 'Chargement…')); m.append(holder);
  const data = await Cloud.members(); holder.innerHTML = '';
  if (!data) { holder.append(el('p', 'formmsg bad', 'Impossible de charger les membres : ' + (Cloud.lastError() || 'pas de connexion') + '. ' + GRANT_HINT)); return; }
  holder.append(el('p', 'sub', data.profiles.length + ' membre(s) inscrit(s).'));
  data.profiles.forEach(pf => {
    const mine = data.progress.filter(r => r.user_id === pf.id); const okN = mine.filter(r => r.last === true).length;
    const last = mine.reduce((a, r) => r.updated_at > a ? r.updated_at : a, '');
    const d = el('div', 'card arow'); const t = el('div', 't'); t.append(el('b', null, pf.display_name || 'Sans nom')); t.append(el('span', 'sub', okN + ' questions réussies · ' + mine.length + ' tentées' + (last ? ' · actif le ' + new Date(last).toLocaleDateString('fr-FR') : '')));
    d.append(t); holder.append(d);
  });
}
